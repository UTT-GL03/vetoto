name: Start application
description: Once done, the application is ready on `localhost:80`.

runs:
  using: composite
  steps:
    - name: Get frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist
    - name: Generate testing dataset
      run: |
        npm install dummy-json
        npx dummy-json@latest ./docs/sample_campaigns_scaling.hbs > ./frontend/sample_campaigns.json
        npx dummy-json@latest ./docs/sample_sheets_scaling.hbs > ./frontend/sample_data.json
    - name: Start containers
      run: |
        docker compose up --detach
      shell: bash
    - name: Wait for frontend
      uses: docker://benel/wait-for-response:1
      with:
        args: http://localhost/ 200 30000 500